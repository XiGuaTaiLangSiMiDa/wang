<!DOCTYPE html>
<html>
<head>
    <title>交易预测反馈系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="feedback.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <h1 class="mb-4">交易预测反馈系统</h1>
        
        <div class="controls">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">选择时间范围</label>
                    <input type="text" class="form-control" id="dateRange">
                </div>
                <div class="col-md-2">
                    <label class="form-label">K线周期</label>
                    <select class="form-select" id="timeframe">
                        <option value="15m">15分钟</option>
                        <option value="1h">1小时</option>
                        <option value="4h">4小时</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">技术指标</label>
                    <div class="indicator-controls">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="showMA" checked>
                            <label class="form-check-label">均线</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="showBB" checked>
                            <label class="form-check-label">布林带</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="showVolume" checked>
                            <label class="form-check-label">成交量</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="showMACD">
                            <label class="form-check-label">MACD</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="showRSI">
                            <label class="form-check-label">RSI</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <button class="btn btn-primary d-block w-100" onclick="app.loadData()">加载数据</button>
                </div>
            </div>
        </div>

        <div class="loading" id="loadingIndicator">
            <div class="spinner-border loading-spinner text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">正在处理...</p>
        </div>

        <div class="row">
            <div class="col-md-9">
                <!-- 主图表区域 -->
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#chartTab">K线图表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#analysisTab">预测分析</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#statsTab">统计数据</a>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="chartTab">
                        <div id="candlestickChart" class="chart-container"></div>
                        <div id="volumeChart" class="mini-chart"></div>
                        <div id="indicatorChart" class="mini-chart"></div>
                    </div>
                    <div class="tab-pane fade" id="analysisTab">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="stats-card">
                                    <h5>预测准确率</h5>
                                    <div id="accuracyChart" class="accuracy-chart"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stats-card">
                                    <h5>信号分布</h5>
                                    <div id="signalDistributionChart" class="accuracy-chart"></div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <div class="stats-card">
                                    <h5>预测表现趋势</h5>
                                    <div id="performanceTrendChart" class="accuracy-chart"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="statsTab">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="stats-card">
                                    <h5>总预测次数</h5>
                                    <div class="stats-value" id="totalPredictions">-</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stats-card">
                                    <h5>正确预测</h5>
                                    <div class="stats-value" id="correctPredictions">-</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stats-card">
                                    <h5>准确率</h5>
                                    <div class="stats-value" id="accuracy">-</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stats-card">
                                    <h5>平均收益率</h5>
                                    <div class="stats-value" id="avgReturn">-</div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <div class="stats-card">
                                    <h5>预测历史记录</h5>
                                    <div class="table-responsive">
                                        <table class="table table-striped">
                                            <thead>
                                                <tr>
                                                    <th>时间</th>
                                                    <th>预测信号</th>
                                                    <th>预测概率</th>
                                                    <th>实际结果</th>
                                                    <th>收益率</th>
                                                </tr>
                                            </thead>
                                            <tbody id="predictionHistory">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="feedback-form">
                    <h4>添加交易反馈</h4>
                    <form id="feedbackForm" onsubmit="app.submitFeedback(event)">
                        <div class="mb-3">
                            <label class="form-label">选择时间点</label>
                            <input type="text" class="form-control" id="feedbackTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">实际结果</label>
                            <select class="form-select" id="feedbackResult" required>
                                <option value="1">盈利</option>
                                <option value="0">亏损</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">收益率</label>
                            <input type="number" class="form-control" id="feedbackReturn" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">持仓时间(小时)</label>
                            <input type="number" class="form-control" id="feedbackDuration" step="0.1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="feedbackNote" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">提交反馈</button>
                    </form>
                </div>

                <div class="feedback-list" id="feedbackList">
                </div>

                <div class="mt-4">
                    <button class="btn btn-success w-100" onclick="app.retrainModel()">
                        重新训练模型
                    </button>
                    <div id="retrainStatus" class="mt-2 text-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/chart_utils.js"></script>
    <script src="js/analysis_utils.js"></script>
    <script src="js/data_loader.js"></script>
    <script>
        // 应用主类
        class App {
            constructor() {
                this.dataLoader = new DataLoader();
                this.initializeDatePickers();
                this.initializeCharts();
                this.setupEventListeners();
            }

            initializeDatePickers() {
                this.dateRange = flatpickr("#dateRange", {
                    mode: "range",
                    enableTime: true,
                    dateFormat: "Y-m-d H:i",
                    time_24hr: true,
                    maxDate: new Date(),
                    defaultDate: [
                        moment().subtract(7, 'days').toDate(),
                        new Date()
                    ]
                });

                this.feedbackTime = flatpickr("#feedbackTime", {
                    enableTime: true,
                    dateFormat: "Y-m-d H:i",
                    time_24hr: true,
                    maxDate: new Date()
                });
            }

            initializeCharts() {
                ChartUtils.initCharts();
                window.addEventListener('resize', () => {
                    ChartUtils.resizeCharts();
                });
            }

            setupEventListeners() {
                document.querySelectorAll('.indicator-controls input').forEach(input => {
                    input.addEventListener('change', () => {
                        const currentData = this.dataLoader.getCurrentData();
                        if (currentData.length > 0) {
                            ChartUtils.updateMainChart(currentData, []);
                            ChartUtils.updateIndicatorChart(currentData);
                        }
                    });
                });
            }

            async loadData() {
                const [startDate, endDate] = this.dateRange.selectedDates;
                const timeframe = document.getElementById('timeframe').value;

                document.getElementById('loadingIndicator').style.display = 'block';

                try {
                    const data = await this.dataLoader.loadData(startDate, endDate, timeframe);
                    const feedbackData = await this.dataLoader.loadFeedback();

                    ChartUtils.updateMainChart(data.candleData, data.predictions);
                    ChartUtils.updateVolumeChart(data.candleData);
                    ChartUtils.updateIndicatorChart(data.candleData);
                    ChartUtils.updateAnalysisCharts(data.predictions, feedbackData);
                    AnalysisUtils.updateStatistics(data.predictions, feedbackData);

                } catch (error) {
                    alert(error.message);
                } finally {
                    document.getElementById('loadingIndicator').style.display = 'none';
                }
            }

            async submitFeedback(event) {
                event.preventDefault();
                
                const feedback = {
                    timestamp: this.feedbackTime.selectedDates[0].getTime(),
                    result: document.getElementById('feedbackResult').value === '1',
                    returnRate: parseFloat(document.getElementById('feedbackReturn').value),
                    duration: parseFloat(document.getElementById('feedbackDuration').value),
                    note: document.getElementById('feedbackNote').value
                };

                try {
                    await this.dataLoader.submitFeedback(feedback);
                    document.getElementById('feedbackForm').reset();
                    this.loadData(); // 重新加载数据以更新显示
                } catch (error) {
                    alert(error.message);
                }
            }

            async retrainModel() {
                const status = document.getElementById('retrainStatus');
                status.textContent = '正在重新训练模型...';

                try {
                    await this.dataLoader.retrainModel();
                    status.textContent = '模型重新训练完成！';
                    setTimeout(() => status.textContent = '', 3000);
                    this.loadData(); // 重新加载数据以使用新模型
                } catch (error) {
                    status.textContent = error.message;
                }
            }
        }

        // 初始化应用
        const app = new App();
        window.app = app; // 导出到全局以供HTML元素使用
    </script>
</body>
</html>
