<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布林带策略回测结果</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>布林带策略回测结果</h1>
            <div class="controls">
                <div class="select-container">
                    <label for="timeframeSelect">K线周期:</label>
                    <select id="timeframeSelect">
                        <option value="15m">15分钟</option>
                        <option value="1h">1小时</option>
                        <option value="4h">4小时</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="summary-box">
            <div class="summary-grid">
                <div class="summary-item">
                    <span class="summary-label">分析周期</span>
                    <span class="summary-value" id="analysisPeriod"></span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">总交易次数</span>
                    <span class="summary-value" id="totalTrades"></span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">总收益</span>
                    <span class="summary-value" id="totalProfit"></span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">胜率</span>
                    <span class="summary-value" id="winRate"></span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="chart-header">
                <h2>K线图与交易信号</h2>
            </div>
            <div id="candlestickChart"></div>
        </div>

        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="showTab('charts')">图表分析</button>
                <button class="tab-button" onclick="showTab('trades')">交易记录</button>
                <button class="tab-button" onclick="showTab('resistance')">阻力位分析</button>
            </div>

            <div id="charts" class="tab-content active">
                <div class="card">
                    <h3>交易退出类型分布</h3>
                    <canvas id="exitTypeChart"></canvas>
                </div>
                <div class="card">
                    <h3>各类型平均收益</h3>
                    <canvas id="avgProfitChart"></canvas>
                </div>
                <div class="card">
                    <h3>累计收益曲线</h3>
                    <canvas id="equityCurveChart"></canvas>
                </div>
            </div>

            <div id="trades" class="tab-content">
                <div class="card">
                    <h3>最近交易记录</h3>
                    <div id="recentTrades"></div>
                </div>
            </div>

            <div id="resistance" class="tab-content">
                <div class="card">
                    <h3>阻力位退出详细分析</h3>
                    <div id="resistanceBreakdown"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).style.display = 'block';
            document.querySelector(`button[onclick="showTab('${tabId}')"]`).classList.add('active');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
