<!DOCTYPE html>
<html>
<head>
    <title>交易模型训练分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>交易模型训练分析</h1>
            <p>基于SOL-USDT-SWAP 15分钟K线数据的机器学习模型分析</p>
        </div>

        <h2 class="section-title">K线图与盈利机会标记</h2>
        <div class="chart-container">
            <div id="candlestickChart" class="candlestick-chart"></div>
        </div>

        <h2 class="section-title">数据集统计</h2>
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">总样本数</div>
                <div class="stat-value" id="totalSamples">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">正样本数</div>
                <div class="stat-value" id="positiveSamples">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">正样本比例</div>
                <div class="stat-value" id="positiveRatio">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">基准准确率</div>
                <div class="stat-value" id="baselineAccuracy">-</div>
            </div>
        </div>

        <h2 class="section-title">特征分布</h2>
        <div class="chart-container">
            <div id="featureDistribution" class="chart"></div>
        </div>

        <h2 class="section-title">特征列表</h2>
        <div class="feature-list" id="featureList"></div>

        <h2 class="section-title">盈利机会分布</h2>
        <div class="chart-container">
            <div id="profitDistribution" class="chart"></div>
        </div>
    </div>

    <script src="visualization_utils.js"></script>
    <script>
        async function loadTrainingData() {
            try {
                const response = await fetch('/data/training_data.json');
                const data = await response.json();
                console.log('Loaded data:', data);
                if (!data.candleData || !data.candleData['15m']) {
                    throw new Error('Invalid data structure: missing candleData or 15m timeframe');
                }
                return data;
            } catch (error) {
                console.error('加载训练数据失败:', error);
                document.body.innerHTML = `
                    <div class="error-message">
                        错误: 无法加载数据文件。请确保:
                        <ul>
                            <li>已运行 train_model.js 生成数据</li>
                            <li>data/training_data.json 文件存在</li>
                            <li>通过HTTP服务器访问此页面</li>
                        </ul>
                        详细错误: ${error.message}
                    </div>`;
                return null;
            }
        }

        function updateStats(metadata) {
            document.getElementById('totalSamples').textContent = metadata.totalSamples.toLocaleString();
            document.getElementById('positiveSamples').textContent = metadata.positiveSamples.toLocaleString();
            document.getElementById('positiveRatio').textContent = (metadata.positiveSamples / metadata.totalSamples * 100).toFixed(2) + '%';
            document.getElementById('baselineAccuracy').textContent = (metadata.baselineAccuracy * 100).toFixed(2) + '%';
        }

        function displayFeatureList(features) {
            const featureList = document.getElementById('featureList');
            const featureNames = Object.keys(features[0]);
            
            featureNames.forEach(feature => {
                const div = document.createElement('div');
                div.className = 'feature-item';
                div.textContent = feature;
                featureList.appendChild(div);
            });
        }

        async function initializePage() {
            try {
                const data = await loadTrainingData();
                if (data) {
                    console.log('Initializing with data:', data);
                    updateStats(data.metadata);
                    if (data.candleData && data.candleData['15m']) {
                        console.log('Creating candlestick chart with data length:', data.candleData['15m'].length);
                        ChartUtils.createCandlestickChart(data.candleData);
                    } else {
                        console.error('No valid candle data available:', data.candleData);
                    }
                    ChartUtils.createFeatureDistributionChart(data.features);
                    ChartUtils.createProfitDistributionChart(data.labels);
                    displayFeatureList(data.features);
                }
            } catch (error) {
                console.error('初始化页面失败:', error);
            }
        }

        window.addEventListener('load', initializePage);
    </script>
</body>
</html>
